<html><body>
<h3>নমুনা ব্যবসা আইন, ২০১০ ( ২০১০ সনের ৫ নং আইন )</h3>
<div class="lineremoves">
<p>১। এই আইনে "ব্যবসায়ী" অর্থ নিবন্ধিত কোনো ব্যক্তিকে বুঝাইবে।</p>
<p>২। নিবন্ধন ব্যতীত কোনো ব্যবসা করা যাইবে না।</p>
<p>৩। প্রত্যেক ব্যবসায়ী বার্ষিক প্রতিবেদন দাখিল করিবে।</p>
<p>৪। সরকার প্রজ্ঞাপন দ্বারা ফি নির্ধারণ করিতে পারিবে।</p>
</div></body></html>
